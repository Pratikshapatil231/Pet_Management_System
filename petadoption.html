<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Adoption / Sales | Pet Management System</title>
  <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><h2><span>🐾</span> Pet Management</h2></div>
      <ul class="sidebar-nav">
        <li><a href="/dashboard" class="active"><span class="nav-icon">🏠</span> Dashboard</a></li>
        <li><a href="/pet_registration"><span class="nav-icon">🐕</span> Pet Registration</a></li>
        <li><a href="/customer_registration"><span class="nav-icon">👤</span> Customer Registration</a></li>
        <li><a href="/petadoption"><span class="nav-icon">🤝</span> Pet Adoption / Sales</a></li>
        <li><a href="/pet_ health"><span class="nav-icon">💉</span> Pet Health & Vaccination</a></li>
        <li><a href="index.html"><span class="nav-icon">🚪</span> Logout</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <h1>Pet Adoption / Sales</h1>
        <p>Process pet adoption or sale transactions</p>
      </header>

      <div class="form-card">
        <div class="form-card-header"><h2>Sale / Adoption Details</h2></div>
        <div class="form-card-body">
        <form  action="/pet_adoption_demo" method="post">
            <div class="form-grid">
              <div class="form-group">
                <label for="sale-id">Sale ID</label>
                <input type="text" id="sale-id" name="sale_id">
                <span class="form-hint">Auto-generated ID</span>
              </div>

              <div class="form-group">
                <label for="sale-date">Sale Date <span class="required">*</span></label>
                <input type="date" id="sale-date" name="sale_date" required>
              </div>

              <div class="form-group">
                <label for="customer-search">Customer <span class="required">*</span></label>
                <div class="search-box">
                  <input type="search" id="customer-search" name="customer_search" placeholder="Search customer by name or ID..." list="customer-list" required>
                </div>
                <datalist id="customer-list">
                  <option value="CUS-2026-001 — John Smith">
                  <option value="CUS-2026-002 — Jane Doe">
                  <option value="CUS-2026-003 — Mike Johnson">
                </datalist>
              </div>

              <div class="form-group">
                <label for="pet-search">Pet <span class="required">*</span></label>
                <div class="search-box">
                  <input type="search" id="pet-search" name="pet_search" placeholder="Search pet by name or ID..." list="pet-list" required>
                </div>
                <datalist id="pet-list">
                  <option value="PET-2026-001 — Max (Labrador)">
                  <option value="PET-2026-002 — Bella (Persian Cat)">
                  <option value="PET-2026-003 — Charlie (German Shepherd)">
                </datalist>
              </div>

              <div class="form-group">
                <label for="payment-method">Payment Method <span class="required">*</span></label>
                <select id="payment-method" name="payment_method" required>
                  <option value="">Select method</option>
                  <option value="cash">Cash</option>
                  <option value="card">Credit / Debit Card</option>
                  <option value="upi">UPI</option>
                  <option value="bank-transfer">Bank Transfer</option>
                  <option value="emi">EMI</option>
                </select>
              </div>

              <div class="form-group">
                <label for="total-amount">Total Amount (₹) <span class="required">*</span></label>
                <input type="number" id="total-amount" name="total_amount" min="0" step="0.01" placeholder="0.00" required>
              </div>

              <div class="form-group">
                <label for="discount">Discount (₹)</label>
                <input type="number" id="discount" name="discount" min="0" step="0.01" placeholder="0.00" value="0">
              </div>

              <div class="form-group">
                <label for="final-amount">Final Amount (₹) <span class="required">*</span></label>
                <input type="number" id="final-amount" name="final_amount" min="0" step="0.01" placeholder="0.00" required>
              </div>

              <div class="form-group full-width">
                <div class="checkbox-group">
                  <input type="checkbox" id="agreement" name="agreement" required>
                  <label for="agreement">Adoption Agreement Accepted <span class="required">*</span></label>
                </div>
              </div>

              <div class="form-group full-width">
                <label for="remarks">Remarks</label>
                <textarea id="remarks" name="remarks" placeholder="Any additional notes about this sale or adoption..."></textarea>
              </div>
            </div>

            <div class="form-actions">
              <button type="reset" class="btn btn-secondary">Clear Form</button>
              <button type="submit" class="btn btn-accent">Complete Sale</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
